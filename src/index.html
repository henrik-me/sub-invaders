<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="flags" content="dailyChallenge=off" />
  <title>Sub Invaders</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      align-items: center;
      background: #061525;
      color: #dffcff;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      justify-content: center;
      min-height: 100dvh;
    }

    main {
      align-items: center;
      display: flex;
      flex: 1;
      justify-content: center;
      padding: 1rem;
      width: 100%;
    }

    canvas {
      background: linear-gradient(180deg, #061525 0%, #0b4f63 62%, #12a7a0 100%);
      border: 2px solid #12a7a0;
      box-shadow: 0 0 32px rgb(18 167 160 / 35%);
      display: block;
      image-rendering: pixelated;
      max-height: calc(100dvh - 4rem);
      max-width: min(100%, 800px);
    }

    footer {
      color: rgb(223 252 255 / 65%);
      font-size: 0.78rem;
      padding: 0.75rem 1rem 1rem;
      text-align: center;
    }

    a {
      color: #dffcff;
    }
  </style>
</head>
<body>
  <main aria-label="Sub Invaders game">
    <canvas id="game-canvas" width="800" height="600">
      Sub Invaders requires a browser with HTML5 Canvas support.
    </canvas>
  </main>
  <script type="module" src="./game/main.mjs"></script>
</body>
</html>
