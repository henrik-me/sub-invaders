# .github/workflows/ci.yml — CS01 deliverable #7.
# Runs harness lint, harness sync check, JS tests, and .NET tests on every
# push to main and every pull request targeting main. The umbrella `ci` job
# is the single status-check context that the Ruleset requires.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-lint:
    name: harness-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Run harness lint
        run: |
          CLI_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness.config.json','utf8')).version)")
          npx -y "github:henrik-me/agent-harness#${CLI_REF}" lint --quiet

  harness-sync-check:
    name: harness-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Run harness sync check
        run: |
          CLI_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness.config.json','utf8')).version)")
          npx -y "github:henrik-me/agent-harness#${CLI_REF}" sync --mode=check --cwd .

  js-tests:
    name: js-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install dependencies
        # CS13: the unit tests import the canvas-game-engine git-URL dependency,
        # so node_modules must be installed (the engine is no longer vendored
        # in-tree). Other jobs (coverage, e2e, swa-deploy) already run `npm ci`.
        run: npm ci
      - name: Run JS tests
        # Per CS01-R7: must NOT fail if the glob has no matches (expected in CS01).
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(src/**/*.test.mjs scripts/**/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests yet — skipping (expected for CS01)."
            exit 0
          fi
          node --test "${files[@]}"

  dotnet-tests:
    name: dotnet-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET tests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "api" ] || ! ls api/*.csproj 1> /dev/null 2>&1; then
            echo "No .NET project at api/ — skipping (unexpected after CS01; investigate)."
            exit 0
          fi
          dotnet restore api/
          dotnet test api/ --configuration Release --logger:"console;verbosity=normal"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install deps
        shell: bash
        run: npm ci
      - name: Install Playwright browsers (chromium only)
        shell: bash
        run: npx playwright install --with-deps chromium
      # CS09 Phase 1 regression guard: c8 fails the step if unit coverage
      # drops below the CS09 target (lines=90, stmts=90, funcs=90, branches=85).
      # Bash glob expansion needed (Node 20 does NOT auto-glob "src/**/*.test.mjs").
      - name: Unit test coverage (with threshold guard)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(src/**/*.test.mjs scripts/**/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests — skipping"
            exit 0
          fi
          npx c8 \
            --reporter=text --reporter=text-summary --reporter=json-summary --reporter=lcov \
            --include "src/**/*.mjs" \
            --exclude "src/**/*.test.mjs" \
            --exclude "src/dist/**" \
            --exclude "src/game/test-hooks.mjs" \
            --report-dir=coverage-report-unit \
            --check-coverage --lines=90 --statements=90 --functions=90 --branches=85 \
            node --test "${files[@]}"
      # CS09 per-file floors for the UNIT suite. The c8 step above enforces only
      # suite-level totals; coverage-perfile.mjs enforces the per-file floors in
      # coverage-thresholds.json against the json-summary that step wrote. (E2E
      # already runs its per-file gate via `npm run test:e2e:coverage` below.)
      - name: Unit per-file coverage floors
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f coverage-report-unit/coverage-summary.json ]; then
            echo "No unit coverage summary (no tests ran) — skipping per-file floors."
            exit 0
          fi
          npm run coverage:check:unit
      # CS14: E2E coverage instruments the bundled output (src/dist/main.mjs),
      # so build it first. test:e2e:coverage also self-builds via its
      # pretest:e2e:coverage npm hook + the Playwright webServer command; this
      # explicit step makes the bundle dependency visible in the workflow.
      - name: Build frontend bundle
        shell: bash
        run: npm run build
      # CS09 Phase 1 regression guard: monocart-reporter onEnd hook fails the
      # step if E2E coverage drops below CS09 floor (lines=77, stmts=87,
      # funcs=84, branches=70, bytes=80). Per-file E2E exception list in
      # OPERATIONS.md "Coverage policy".
      - name: E2E test coverage (with threshold guard)
        shell: bash
        run: npm run test:e2e:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage-report/
            coverage-report-unit/
          retention-days: 14

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [harness-lint, harness-sync-check, js-tests, dotnet-tests, coverage]
    if: ${{ always() }}
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "needs results: $results"
          echo "$results" | jq -e 'all(.[]; .result == "success")' \
            || { echo "::error::One or more required jobs did not succeed (skipped or failed)."; exit 1; }
          echo "All required CI jobs passed."
