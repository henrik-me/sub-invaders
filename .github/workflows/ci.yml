# .github/workflows/ci.yml — CS01 deliverable #7.
# Runs harness lint, harness sync check, JS tests, and .NET tests on every
# push to main and every pull request targeting main. The umbrella `ci` job
# is the single status-check context that the Ruleset requires.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness-lint:
    name: harness-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Run harness lint
        run: |
          CLI_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness.config.json','utf8')).version)")
          npx -y "github:henrik-me/agent-harness#${CLI_REF}" lint --quiet

  harness-sync-check:
    name: harness-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Run harness sync check
        run: |
          CLI_REF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness.config.json','utf8')).version)")
          npx -y "github:henrik-me/agent-harness#${CLI_REF}" sync --mode=check --cwd .

  js-tests:
    name: js-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Run JS tests
        # Per CS01-R7: must NOT fail if the glob has no matches (expected in CS01).
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(src/**/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests yet — skipping (expected for CS01)."
            exit 0
          fi
          node --test "${files[@]}"

  dotnet-tests:
    name: dotnet-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET tests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "api" ] || ! ls api/*.csproj 1> /dev/null 2>&1; then
            echo "No .NET project at api/ — skipping (unexpected after CS01; investigate)."
            exit 0
          fi
          dotnet restore api/
          dotnet test api/ --configuration Release --logger:"console;verbosity=normal"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Install deps
        shell: bash
        run: npm ci
      - name: Install Playwright browsers (chromium only)
        shell: bash
        run: npx playwright install --with-deps chromium
      # CS09 Phase 1 regression guard: c8 fails the step if unit coverage
      # drops below the baseline floor (lines=86, stmts=86, funcs=84,
      # branches=74). Phase 3 raises these to ≥90/85 once Phase 2 tests land.
      - name: Unit test coverage (with threshold guard)
        shell: bash
        run: npm run test:unit:coverage
      # CS09 Phase 1 regression guard: monocart-reporter onEnd hook fails the
      # step if E2E coverage drops below baseline floor (lines=68, stmts=78,
      # funcs=76, branches=60, bytes=76). Phase 3 raises these to targets.
      - name: E2E test coverage (with threshold guard)
        shell: bash
        run: npm run test:e2e:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: |
            coverage-report/
            coverage-report-unit/
          retention-days: 14

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [harness-lint, harness-sync-check, js-tests, dotnet-tests, coverage]
    steps:
      - run: echo "All required CI jobs passed."
