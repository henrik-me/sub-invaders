name: e2e-coverage

# Runs the Playwright E2E suite under Chromium with V8 JS coverage
# instrumentation enabled (monocart-reporter + monocart-coverage-reports).
#
# Triggers:
#   - schedule: weekly (Sunday 04:00 UTC) — keeps a trend without burning PR CI
#   - workflow_dispatch: manual on-demand
#
# Output: HTML + JSON coverage report uploaded as workflow artifact, plus a
# console-summary printed to the job log.
#
# Cost: ~3-8% wall-clock overhead on test execution + ~5-10s reporter time.
# This workflow is intentionally NOT a PR-required check (see CS07 acceptance
# criteria: e2e-local is required; e2e-coverage is informational).

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to measure coverage on (defaults to main)'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: e2e-coverage-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: e2e-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_COVERAGE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e "const lock=require('./package-lock.json'); console.log(lock.packages['node_modules/@playwright/test'].version)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite with V8 coverage
        run: npm run test:e2e:coverage
      - name: Print coverage summary to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f coverage-report/coverage-report.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('coverage-report/coverage-report.json','utf8'));
              const s = r.summary;
              const rows = [
                ['Bytes', s.bytes],
                ['Statements', s.statements],
                ['Branches', s.branches],
                ['Functions', s.functions],
                ['Lines', s.lines],
              ];
              let md = '## E2E coverage summary\n\n| Metric | % | Covered / Total |\n|---|---:|---:|\n';
              for (const [name, m] of rows) md += '| ' + name + ' | ' + m.pct.toFixed(2) + '% | ' + m.covered + ' / ' + m.total + ' |\n';
              md += '\n### Per-file (lines, sorted asc)\n\n| Lines % | Lines | File |\n|---:|---:|---|\n';
              for (const f of [...r.files].sort((a,b) => a.summary.lines.pct - b.summary.lines.pct)) {
                const rel = (f.sourcePath || f.url || '').replace(/^.*localhost-4173\//,'').replace(/^.*localhost:4173\//,'');
                md += '| ' + f.summary.lines.pct.toFixed(1) + '% | ' + f.summary.lines.covered + '/' + f.summary.lines.total + ' | ' + rel + ' |\n';
              }
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            "
          else
            echo 'coverage-report/coverage-report.json not found' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-coverage-report
          path: coverage-report/
          if-no-files-found: warn
          retention-days: 14
