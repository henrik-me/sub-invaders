name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [swa-deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.event.workflow_run.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-local:
    name: e2e-local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e "const lock=require('./package-lock.json'); console.log(lock.packages['node_modules/@playwright/test'].version)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # CS14: e2e-local serves src/ locally, so the bundle (src/dist/main.mjs)
      # must exist. test:e2e self-builds via its pretest:e2e npm hook + the
      # Playwright webServer command; this explicit step makes it visible.
      - name: Build frontend bundle
        run: npm run build
      - name: Run Chromium E2E suite
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-local
          path: playwright-report/
          if-no-files-found: ignore

  e2e-deployed:
    name: e2e-deployed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      BASE_URL: https://happy-coast-04ffcaa1e-${{ github.event.workflow_run.pull_requests[0].number }}.7.azurestaticapps.net
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e "const lock=require('./package-lock.json'); console.log(lock.packages['node_modules/@playwright/test'].version)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed Chromium E2E suite
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-deployed-pr-${{ env.PR_NUMBER }}
          path: playwright-report/
          if-no-files-found: ignore