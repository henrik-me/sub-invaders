name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: [swa-deploy]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.event.workflow_run.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-local:
    name: e2e-local
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e "const lock=require('./package-lock.json'); console.log(lock.packages['node_modules/@playwright/test'].version)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium E2E suite
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-local
          path: playwright-report/
          if-no-files-found: ignore

  e2e-deployed:
    name: e2e-deployed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      BASE_URL: https://happy-coast-04ffcaa1e-${{ github.event.workflow_run.pull_requests[0].number }}.7.azurestaticapps.net
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Read Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e "const lock=require('./package-lock.json'); console.log(lock.packages['node_modules/@playwright/test'].version)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed Chromium E2E suite
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-deployed-pr-${{ env.PR_NUMBER }}
          path: playwright-report/
          if-no-files-found: ignore