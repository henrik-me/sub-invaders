# .github/workflows/swa-deploy.yml — CS01 deliverable #7 / CS01-9.
#
# Deploys the static frontend and .NET Function to Azure Static Web Apps.
# Push to main  → production deploy.
# Pull request  → preview environment (SWA action posts preview URL comment
#                 to the PR using GITHUB_TOKEN; requires pull-requests: write).
# PR closed     → preview environment torn down (close_pull_request job).
#
# IMPORTANT (CS01-9): this workflow is committed unguarded by job-level `if:`
# so that the missing-secret failure on first `push:main` is loud and visible
# (that was the deliberate gate-G5 signal during CS01).
#
# Post-G5 fixup (PR #15): we add `skip_deploy_on_missing_secrets: true` to the
# SWA action itself. The token IS present for repo-pushed branches, so deploy
# proceeds normally. For PRs from the `dependabot[bot]` actor (and forks),
# GitHub does NOT pass repo secrets to the workflow, so the SWA action would
# otherwise fail with `deployment_token was not provided`. The skip flag turns
# that hard failure into a clear "skipped (no token)" message and a green
# check, which is the Azure-recommended pattern for fork/Dependabot PRs.

name: swa-deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Push to main: never cancel - queue production deploys so every merged
  # commit reaches staging. Back-to-back merges with cancel-in-progress=true
  # caused all PR #34..#40 deploys to be cancelled, leaving staging stale
  # and the nightly E2E suite failing against missing test hooks (see
  # Issue #38, LRN-020). PR previews can still cancel-in-progress safely.
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src"
          api_location: "api"
          output_location: ""
          skip_deploy_on_missing_secrets: true

      # Issue #52 / PvI F-002: surface the deployed commit on /api/health.
      # The HealthFunction reads SUB_INVADERS_COMMIT (falling back to GITHUB_SHA,
      # then "unknown"). Without this step, prod /api/health reports
      # commit:"unknown" because the Function host never sees GITHUB_SHA.
      #
      # Gracefully skipped when AZURE_CREDENTIALS is not configured so this
      # workflow stays green until an operator follows the OPERATIONS.md
      # § "Configuring deploy-time commit injection (Issue #52)" runbook.
      - name: Check AZURE_CREDENTIALS secret presence
        id: creds-check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=SUB_INVADERS_COMMIT not injected::AZURE_CREDENTIALS secret is not configured. /api/health will continue to report commit:\"unknown\". See OPERATIONS.md § Configuring deploy-time commit injection (Issue #52)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Azure login (Service Principal)
        if: steps.creds-check.outputs.available == 'true'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set SUB_INVADERS_COMMIT app setting on prod SWA
        if: steps.creds-check.outputs.available == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          az staticwebapp appsettings set \
            --name swa-sub-invaders \
            --resource-group rg-sub-invaders-prod \
            --setting-names "SUB_INVADERS_COMMIT=${DEPLOY_SHA}" \
            --output none
          echo "✓ SUB_INVADERS_COMMIT set to ${DEPLOY_SHA} on swa-sub-invaders (rg-sub-invaders-prod)"
      - name: Azure logout
        if: always() && steps.creds-check.outputs.available == 'true'
        run: az logout || true

  close-pull-request:
    name: close-pull-request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          skip_deploy_on_missing_secrets: true
