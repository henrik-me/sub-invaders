# .github/workflows/swa-deploy.yml — CS01 deliverable #7 / CS01-9.
#
# Deploys the static frontend and .NET Function to Azure Static Web Apps.
# Push to main  → production deploy.
# Pull request  → preview environment (SWA action posts preview URL comment
#                 to the PR using GITHUB_TOKEN; requires pull-requests: write).
# PR closed     → preview environment torn down (close_pull_request job).
#
# IMPORTANT (CS01-9): this workflow is committed unguarded by job-level `if:`
# so that the missing-secret failure on first `push:main` is loud and visible
# (that was the deliberate gate-G5 signal during CS01).
#
# Post-G5 fixup (PR #15): we add `skip_deploy_on_missing_secrets: true` to the
# SWA action itself. The token IS present for repo-pushed branches, so deploy
# proceeds normally. For PRs from the `dependabot[bot]` actor (and forks),
# GitHub does NOT pass repo secrets to the workflow, so the SWA action would
# otherwise fail with `deployment_token was not provided`. The skip flag turns
# that hard failure into a clear "skipped (no token)" message and a green
# check, which is the Azure-recommended pattern for fork/Dependabot PRs.

name: swa-deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Qualify the group by event name AND (for PRs) the PR number so the push
  # production deploy and the pull_request:closed teardown never share a group.
  # Previously both used `swa-deploy-${{ github.ref }}`; at a merge the
  # pull_request:closed teardown (cancel-in-progress=true) cancelled the push
  # production deploy within ~2s, leaving prod stale until a manual re-run
  # (Issue #38, LRN-020, LRN-028; fixed in CS17). Per-PR isolation also keeps
  # rapid PR events from cancelling each other's preview teardown. Push deploys
  # still never cancel-in-progress, so back-to-back merges only supersede an
  # older *pending* deploy.
  group: swa-deploy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    # Issue #52: BUILD_COMMIT is forwarded by Oryx (SWA's build engine) to
    # dotnet build, where api/Sub-invaders.Api.csproj injects it into the
    # AssemblyInformationalVersionAttribute. /api/health then reads the
    # commit out of the assembly at runtime — atomic with the deploy
    # artifact, no Service Principal or post-deploy mutation required.
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # CS14: build the frontend bundle (src/dist/main.mjs) before the SWA
      # upload. The job had no Node setup before — app_location: "src" has no
      # src/package.json, so Oryx never npm-built the frontend; it shipped raw
      # static assets. Post-CS14 the root npm project's build is the canonical
      # frontend build, run explicitly here so src/dist/ is present in the
      # uploaded artifact. The API build (api_location: "api") is unaffected.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend bundle
        run: npm run build
      - name: Inject build SHA
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          FILES=()
          for file in src/index.html src/sw.mjs; do
            if [ -f "$file" ]; then
              FILES+=("$file")
            fi
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            sed -i "s/__BUILD_SHA__/$SHORT_SHA/g" "${FILES[@]}"
          fi
          if [ "${#FILES[@]}" -gt 0 ] && grep -R -n "__BUILD_SHA__" "${FILES[@]}"; then
            echo "::error::build-sha placeholder not substituted"
            exit 1
          fi
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src"
          api_location: "api"
          output_location: ""
          skip_deploy_on_missing_secrets: true

  close-pull-request:
    name: close-pull-request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          skip_deploy_on_missing_secrets: true
